# Bundle patch layer for dsh-escalation-noop. Applied to every profile that
# lists "dsh-escalation-noop" in its `dsh.profile.bundles` — a top-level YAML
# array of loader patch entries (see
# ~/.dsh/profiles/node_modules/@deepseek-ai/dsh-base/cordis.patch.yml for the
# bundle-side example).
#
# The row mounts the self-healing patch plugin: same-mode sandbox_permissions
# requests become a no-op grant (real escalations still prompt, downgrades
# still throw), and the plugin re-applies the vendor-file patch at boot, on
# clean exit, and on a periodic check so dsh upgrades can never disable it.
#
# Optional override via the user patch layer (~/.dsh/cordis.patch.yml):
#   - id: escalation-noop
#     config:
#       intervalMs: 600000   # periodic re-check period; 0 disables
- insert:
    - id: escalation-noop
      name: dsh-escalation-noop
